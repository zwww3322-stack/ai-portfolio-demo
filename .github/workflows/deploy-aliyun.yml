name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main
    paths:
      - "ai-portfolio-cloudflare/**"
      - ".github/workflows/deploy-aliyun.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-awinways-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-portfolio-cloudflare

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: ai-portfolio-cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:aliyun

      - name: Configure SSH
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ALIYUN_HOST" >> ~/.ssh/known_hosts

      - name: Deploy static files
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          tar -C out -czf - . | ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$ALIYUN_USER@$ALIYUN_HOST" \
            "tar -xzf - -C /www/wwwroot/awinways.com"
